server {
    listen 80;
    server_name exvsdb-cn.top www.exvsdb-cn.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name exvsdb-cn.top www.exvsdb-cn.top;

    ssl_certificate     /etc/ssl/exvsdb/exvsdb-cn.top.pem;
    ssl_certificate_key /etc/ssl/exvsdb/exvsdb-cn.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /data/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA fallback（vue-router history 模式必须）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
