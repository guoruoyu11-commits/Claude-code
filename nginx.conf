server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /data/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA fallback（vue-router history 模式必须）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
